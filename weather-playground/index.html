<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pyboat weather playground</title>
  </head>
  <body>
    <main>
      <canvas id="preview" aria-label="Procedural weather and terrain preview"></canvas>
      <div class="scale-bar" aria-label="Map scale">
        <div id="scale-line"><span></span><span></span><span></span><span></span></div>
        <div class="scale-labels"><span>0</span><span id="scale-label">200 m</span></div>
      </div>
      <aside>
        <header>
          <p>PYBOAT / PROCEDURAL LAB</p>
          <h1>Weather playground</h1>
          <span id="status">Starting WebGPU…</span>
          <div class="navigation-hint">Drag to pan · mouse wheel to zoom</div>
        </header>
        <nav id="presets" aria-label="Weather presets"></nav>
        <div id="controls"></div>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
