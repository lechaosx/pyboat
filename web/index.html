<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sailing game</title>
  </head>
  <body>
    <main>
      <canvas id="game" aria-label="Multiplayer sailing boats on the water"></canvas>
      <section class="overlay">
        <p class="eyebrow">NAVAL COMBAT / MULTIPLAYER</p>
        <h1>Under sail</h1>
        <p id="status">Starting WebGPU…</p>
        <dl class="telemetry">
          <div>
            <dt>Speed</dt>
            <dd><span id="speed">0.0</span> m/s</dd>
          </div>
          <div>
            <dt>Apparent wind</dt>
            <dd><span id="apparent-wind">6.0</span> m/s</dd>
          </div>
          <div>
            <dt>Point of sail</dt>
            <dd id="point-of-sail">close-hauled</dd>
          </div>
          <div>
            <dt>Health</dt>
            <dd id="health">100</dd>
          </div>
          <div>
            <dt>Water depth</dt>
            <dd><span id="water-depth">0.0</span> m</dd>
          </div>
          <div>
            <dt>Under keel</dt>
            <dd><span id="bottom-clearance">0.0</span> m</dd>
          </div>
          <div>
            <dt>Bottom</dt>
            <dd id="bottom-contact">clear</dd>
          </div>
        </dl>
        <p class="controls">W/S power · A/D turn · left stick move</p>
        <p class="practice">Coral hulls · remote players</p>
      </section>
      <div class="scale-bar" aria-label="Map scale">
        <div id="scale-line">
          <span></span><span></span><span></span><span></span>
        </div>
        <div class="scale-labels"><span>0</span><span id="scale-label">2 m</span></div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
