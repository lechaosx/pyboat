<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pyboat</title>
  </head>
  <body>
    <main>
      <canvas id="game" aria-label="A controllable sailing boat on the water"></canvas>
      <section class="overlay">
        <p class="eyebrow">PYBOAT / RUST SIMULATION</p>
        <h1>Under sail</h1>
        <p id="status">Starting WebGPU…</p>
        <dl class="telemetry">
          <div>
            <dt>Speed</dt>
            <dd><span id="speed">0.0</span> m/s</dd>
          </div>
          <div>
            <dt>Apparent wind</dt>
            <dd><span id="apparent-wind">6.0</span> m/s</dd>
          </div>
          <div>
            <dt>Point of sail</dt>
            <dd id="point-of-sail">close-hauled</dd>
          </div>
        </dl>
        <p class="controls">W/S power · A/D turn · left stick move</p>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
