version: "3.8"

services:
  server:
    image: ${PYBOAT_IMAGE:?PYBOAT_IMAGE is required}
    ports:
      - target: 8765
        published: 8765
        protocol: udp
        mode: host
    volumes:
      - type: bind
        source: ${PYBOAT_CERTIFICATE_DIR:?PYBOAT_CERTIFICATE_DIR is required}
        target: /certificates
        read_only: true
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.platform.arch == aarch64
      update_config:
        order: stop-first
        failure_action: rollback
      restart_policy:
        condition: any
