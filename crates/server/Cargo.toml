[package]
name = "server"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[lints]
workspace = true

[dependencies]
game = { path = "../game" }
protocol = { path = "../protocol" }
simulation = { path = "../simulation" }
rapier2d = { version = "0.36.0", features = ["enhanced-determinism"] }
tokio = { version = "1.53.1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
wtransport = "0.7.2"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util"] }
