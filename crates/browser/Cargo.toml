[package]
name = "pyboat-browser"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pyboat-game = { path = "../game" }
pyboat-protocol = { path = "../protocol" }
pyboat-simulation = { path = "../simulation" }
rapier2d = { version = "0.35.1", features = ["enhanced-determinism"] }

[dev-dependencies]
naga = { version = "30.0.0", features = ["wgsl-in"] }
pyboat-server = { path = "../server" }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
wtransport = "0.7.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
bytes = "1"
console_error_panic_hook = "0.1"
url = "2"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "Location", "Window"] }
web-transport-wasm = "0.5.10"
wgpu = { version = "30.0.0", default-features = false, features = ["std", "webgpu", "wgsl"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory"]
