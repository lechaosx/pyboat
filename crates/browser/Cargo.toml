[package]
name = "pyboat-browser"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pyboat-protocol = { path = "../protocol" }
pyboat-simulation = { path = "../simulation" }
rapier2d = { version = "0.35.1", features = ["enhanced-determinism"] }

[dev-dependencies]
futures-util = "0.3.33"
pyboat-server = { path = "../server" }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["CloseEvent", "Event", "HtmlCanvasElement", "Location", "MessageEvent", "WebSocket", "Window"] }
wgpu = { version = "30.0.0", default-features = false, features = ["std", "webgpu", "wgsl"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory"]
