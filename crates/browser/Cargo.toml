[package]
name = "browser"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[lints]
workspace = true

[features]
playground = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
game = { path = "../game" }
protocol = { path = "../protocol" }
simulation = { path = "../simulation" }
rapier2d = { version = "0.36.0", features = ["enhanced-determinism"] }

[build-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in", "wgsl-out"] }

[dev-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in"] }
server = { path = "../server" }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
wtransport = "0.7.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
bytes = "1"
console_error_panic_hook = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
url = "2"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "Location", "Window"] }
web-transport-wasm = "0.8.0"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "webgpu", "wgsl"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory"]
