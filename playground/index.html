<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pyboat World Lab</title>
  </head>
  <body>
    <main>
        <div class="render-view">
          <canvas id="preview" aria-label="Procedural world preview"></canvas>
          <div class="scale-bar" aria-label="Map scale">
            <div id="scale-line"><span></span><span></span><span></span><span></span></div>
            <div class="scale-labels"><span>0</span><span id="scale-label">200 m</span></div>
          </div>
        </div>

        <aside class="lab-panel">
          <header class="panel-header">
            <p>Procedural world / lab</p>
            <h1>Environment controls</h1>
            <span>Tune and inspect the rendered world.</span>
            <span id="status" role="status">Starting WebGPU…</span>
          </header>
          <div class="panel-content">
            <section class="panel-section">
              <div class="panel-section-heading">
                <h2>Scene</h2>
                <button id="reset-tuning" type="button">Reset</button>
              </div>
              <div id="tuning-controls"></div>
            </section>
            <section class="panel-section">
              <h2>World &amp; time</h2>
              <section id="world-toolbar" aria-label="World controls"></section>
            </section>
            <section class="panel-section">
              <h2>Diagnostics</h2>
              <div id="controls"></div>
              <section id="diagnostic-toolbar" aria-label="View-center diagnostics"></section>
            </section>
          </div>
        </aside>
        <div id="sidebar-resizer" role="separator" aria-label="Resize control panel" aria-orientation="vertical" aria-valuemin="288" tabindex="0"></div>
    </main>
    <script>
      const status = document.querySelector("#status");
      const reportStartupError = (reason) => {
        const message = reason instanceof Error ? reason.message : String(reason);
        status.textContent = `Startup failed: ${message}`;
        status.classList.add("error");
        console.error(reason);
      };
      window.addEventListener("error", (event) => reportStartupError(event.error ?? event.message));
      window.addEventListener("unhandledrejection", (event) => reportStartupError(event.reason));
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
