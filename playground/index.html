<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Procedural lab</title>
  </head>
  <body>
    <main>
      <div class="render-view">
        <canvas id="preview" aria-label="Procedural world preview"></canvas>
        <canvas id="geometry-overlay" aria-label="World geometry diagnostic"></canvas>
        <div class="geometry-guide-label" aria-hidden="true" hidden>
          <strong>GEOMETRY GUIDE</strong>
          <span>reference / equator</span>
          <span>longitude seams / poles</span>
          <small>Longitude wraps; the polar exterior continues beyond the pole lines.</small>
        </div>
        <div class="scale-bar" aria-label="Map scale">
          <div id="scale-line"><span></span><span></span><span></span><span></span></div>
          <div class="scale-labels"><span>0</span><span id="scale-label">200 m</span></div>
        </div>
      </div>
      <aside>
        <header>
          <p>PROCEDURAL WORLD / LAB</p>
          <h1>World laboratory</h1>
          <span id="status">Starting WebGPU…</span>
          <div class="navigation-hint">Drag to pan · mouse wheel to zoom</div>
        </header>
        <nav id="domains" class="domains" aria-label="Procedural domains"></nav>
        <section id="world-toolbar" aria-label="World controls"></section>
        <div id="controls"></div>
      </aside>
    </main>
    <script type="module">
      const status = document.querySelector("#status");
      const reportStartupError = (reason) => {
        const message = reason instanceof Error ? reason.message : String(reason);
        status.textContent = `Startup failed: ${message}`;
        console.error(reason);
      };
      window.addEventListener("error", (event) => reportStartupError(event.error ?? event.message));
      window.addEventListener("unhandledrejection", (event) => reportStartupError(event.reason));
      import("/src/main.ts").catch(reportStartupError);
    </script>
  </body>
</html>
