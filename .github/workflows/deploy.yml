name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    environment: production
    env:
      WEBTRANSPORT_HOST: ${{ vars.WEBTRANSPORT_HOST || secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate backend address
        shell: bash
        run: |
          if [[ ! "$WEBTRANSPORT_HOST" =~ ^[a-zA-Z0-9]([a-zA-Z0-9.-]*[a-zA-Z0-9])?$ ]]; then
            echo 'Set WEBTRANSPORT_HOST or production DEPLOY_HOST to the backend DNS name or IPv4 address.' >&2
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm install --global npm@11.19.0
      - name: Install Rust and build tools
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.98.1
          cargo install --locked wasm-pack --version 0.15.0
          cargo install --locked cargo-about --version 0.9.0
      - run: cargo test --locked -p browser --lib webtransport_url
      - run: npm ci
      - name: Build game and third-party notices
        run: npm run build:web
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  backend:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v7
      - name: Image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-backend:
    needs: [frontend, backend]
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      PYBOAT_IMAGE: ${{ needs.backend.outputs.image }}
      WEBTRANSPORT_HOST: ${{ vars.WEBTRANSPORT_HOST || secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure verified SSH connection
        shell: bash
        run: |
          for setting in DEPLOY_HOST DEPLOY_USER DEPLOY_PORT DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [[ -z "${!setting}" ]]; then
              echo "Missing production setting: $setting" >&2
              exit 1
            fi
          done
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] && ((10#$DEPLOY_PORT > 0 && 10#$DEPLOY_PORT <= 65535))
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/pyboat
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host pyboat-deploy
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            Port $DEPLOY_PORT
            IdentityFile ~/.ssh/pyboat
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
            ConnectTimeout 15
          EOF
          echo 'DOCKER_HOST=ssh://pyboat-deploy' >> "$GITHUB_ENV"
      - name: Check server prerequisites
        shell: bash
        run: |
          [[ "$(docker info --format '{{.Swarm.ControlAvailable}}')" == true ]]
      - name: Configure automatic certificates
        shell: bash
        run: |
          ssh pyboat-deploy 'umask 077; mkdir -p "$HOME/.local/share/pyboat"; cat > "$HOME/.local/share/pyboat/certificates.sh.next"; chmod 700 "$HOME/.local/share/pyboat/certificates.sh.next"; mv "$HOME/.local/share/pyboat/certificates.sh.next" "$HOME/.local/share/pyboat/certificates.sh"' < deployment/certificates.sh
          printf -v backend_address '%q' "$WEBTRANSPORT_HOST"
          ssh pyboat-deploy bash -s -- "$backend_address" <<'CERTIFICATES'
          "$HOME/.local/share/pyboat/certificates.sh" install "$1"
          CERTIFICATES
          certificate_directory=$(ssh pyboat-deploy 'printf "%s" "$HOME/.local/share/pyboat/certificates"')
          [[ "$certificate_directory" =~ ^/[a-zA-Z0-9_./-]+$ ]]
          printf 'PYBOAT_CERTIFICATE_DIR=%s\n' "$certificate_directory" >> "$GITHUB_ENV"
      - name: Verify issued certificate
        shell: bash
        run: |
          printf -v certificate_directory '%q' "$PYBOAT_CERTIFICATE_DIR"
          ssh pyboat-deploy sh -s -- "$certificate_directory" <<'CHECK'
          test -r "$1/fullchain.pem" && test -r "$1/privkey.pem"
          CHECK
          certificate_file="$RUNNER_TEMP/pyboat-fullchain.pem"
          ssh pyboat-deploy sh -s -- "$certificate_directory" > "$certificate_file" <<'CERTIFICATE'
          cat "$1/fullchain.pem"
          CERTIFICATE
          if [[ "$WEBTRANSPORT_HOST" =~ ^([0-9]+\.){3}[0-9]+$ ]]; then
            address_option=-verify_ip
          else
            address_option=-verify_hostname
          fi
          openssl verify -purpose sslserver "$address_option" "$WEBTRANSPORT_HOST" -untrusted "$certificate_file" "$certificate_file"
          openssl x509 -in "$certificate_file" -noout -checkend 0
      - name: Deploy backend and wait for convergence
        shell: bash
        run: |
          docker stack deploy --with-registry-auth --compose-file deployment/stack.yml pyboat
          stable_task=
          for attempt in {1..60}; do
            state=$(docker service inspect pyboat_server --format '{{if .UpdateStatus}}{{.UpdateStatus.State}}{{end}}')
            case "$state" in
              paused|rollback_started|rollback_paused|rollback_completed)
                docker service ps --no-trunc pyboat_server
                echo "Backend deployment failed: $state" >&2
                exit 1
                ;;
            esac
            running=$(docker service ps --filter desired-state=running --format '{{.ID}} {{.CurrentState}}' pyboat_server)
            if [[ "$running" == *' Running '* && "$running" != *$'\n'* && ( -z "$state" || "$state" == completed ) ]]; then
              task=${running%% *}
              if [[ "$task" == "$stable_task" ]]; then
                exit 0
              fi
              stable_task=$task
            else
              stable_task=
            fi
            sleep 5
          done
          docker service ps --no-trunc pyboat_server
          echo "Backend did not converge after $attempt checks." >&2
          exit 1

  deploy-pages:
    needs: deploy-backend
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
