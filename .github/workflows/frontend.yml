name: Deploy frontend

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      WEBTRANSPORT_HOST: ${{ vars.WEBTRANSPORT_HOST }}
      WEBTRANSPORT_PORT: "443"
    steps:
      - uses: actions/checkout@v7
      - name: Validate backend address
        shell: bash
        run: |
          if [[ ! "$WEBTRANSPORT_HOST" =~ ^[a-zA-Z0-9]([a-zA-Z0-9.-]*[a-zA-Z0-9])?$ ]]; then
            echo 'Set repository variable WEBTRANSPORT_HOST to the backend DNS name or IPv4 address.' >&2
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm install --global npm@11.19.0
      - name: Install Rust and build tools
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.98.1
          cargo install --locked wasm-pack --version 0.15.0
          cargo install --locked cargo-about --version 0.9.0 --features cli
      - run: cargo test --locked -p browser --lib webtransport_url
      - run: npm ci
      - name: Build game and third-party notices
        run: npm run build:web
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
