name: Deploy backend (discard current match)

on:
  workflow_dispatch:
    inputs:
      discard_current_match:
        description: Restart the backend and permanently discard the game in progress
        required: true
        default: false
        type: boolean

concurrency:
  group: production-backend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: ${{ inputs.discard_current_match }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}@${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust and static build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          rustup toolchain install 1.98.1 --profile minimal --target aarch64-unknown-linux-musl
          rustup default 1.98.1
      - run: cargo test --locked -p server
      - name: Build static ARM64 executable
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --locked --release -p server --target aarch64-unknown-linux-musl
      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Publish ARM64 image
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_IMAGE: ${{ needs.build.outputs.image }}
      WEBTRANSPORT_HOST: ${{ vars.WEBTRANSPORT_HOST }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure verified SSH connection
        shell: bash
        run: |
          for setting in DEPLOY_HOST DEPLOY_USER DEPLOY_PORT DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [[ -z "${!setting}" ]]; then
              echo "Missing production setting: $setting" >&2
              exit 1
            fi
          done
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$WEBTRANSPORT_HOST" =~ ^[a-zA-Z0-9]([a-zA-Z0-9.-]*[a-zA-Z0-9])?$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] && ((10#$DEPLOY_PORT > 0 && 10#$DEPLOY_PORT <= 65535))
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/pyboat
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF_SSH
          Host pyboat-deploy
            HostName $DEPLOY_HOST
            HostKeyAlias raspberrypi
            User $DEPLOY_USER
            Port $DEPLOY_PORT
            IdentityFile ~/.ssh/pyboat
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
            ConnectTimeout 15
          EOF_SSH
      - name: Deploy and discard current match
        shell: bash
        run: |
          [[ "$DEPLOY_IMAGE" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]]
          ssh pyboat-deploy 'test "$(uname -m)" = aarch64 && mkdir -p ~/.cache/pyboat-deploy'
          scp deploy/* pyboat-deploy:.cache/pyboat-deploy/
          # shellcheck disable=SC2029
          ssh pyboat-deploy "sh -se -- '$DEPLOY_IMAGE' '$WEBTRANSPORT_HOST'" <<'EOF_DEPLOY'
          mkdir -p ~/.config/containers/systemd ~/.config/systemd/user ~/.config/pyboat ~/.local/lib/pyboat
          install -m 644 ~/.cache/pyboat-deploy/pyboat.container ~/.config/containers/systemd/
          install -m 644 ~/.cache/pyboat-deploy/pyboat-certificate.service ~/.cache/pyboat-deploy/pyboat-certificate.timer ~/.config/systemd/user/
          install -m 755 ~/.cache/pyboat-deploy/renew-certificate ~/.local/lib/pyboat/renew-certificate.next
          mv ~/.local/lib/pyboat/renew-certificate.next ~/.local/lib/pyboat/renew-certificate
          printf 'WEBTRANSPORT_HOST=%s\n' "$2" > ~/.config/pyboat/environment.next
          mv ~/.config/pyboat/environment.next ~/.config/pyboat/environment
          systemctl --user daemon-reload
          systemctl --user cat pyboat.service >/dev/null
          systemctl --user enable --now pyboat-certificate.timer
          systemctl --user start pyboat-certificate.service
          podman pull "$1"
          current=$(podman image inspect localhost/pyboat:deployed --format '{{.Id}}' 2>/dev/null || true)
          next=$(podman image inspect "$1" --format '{{.Id}}')
          if [ -n "$current" ] && [ "$current" != "$next" ]; then
            podman tag "$current" localhost/pyboat:previous
          fi
          podman tag "$1" localhost/pyboat:deployed
          systemctl --user restart pyboat.service
          sleep 3
          systemctl --user is-active --quiet pyboat.service
          podman image prune --force
          EOF_DEPLOY
