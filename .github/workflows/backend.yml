name: Deploy backend (discard current match)

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Game branch, tag, or full commit SHA to deploy
        required: true
        default: master
        type: string
      discard_current_match:
        description: Restart the backend and permanently discard the game in progress
        required: true
        default: false
        type: boolean

concurrency:
  group: production-backend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: ${{ inputs.discard_current_match }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}@${{ steps.publish.outputs.digest }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision }}
          path: source
      - name: Install Rust and static build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          rustup toolchain install 1.98.1 --profile minimal --target aarch64-unknown-linux-musl
          rustup default 1.98.1
      - run: cargo test --locked -p server
        working-directory: source
      - name: Build static ARM64 executable
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --locked --release -p server --target aarch64-unknown-linux-musl
        working-directory: source
      - name: Set image name
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "revision=$(git -C source rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Publish ARM64 image
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.revision }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment: production
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure verified SSH connection
        shell: bash
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/pyboat
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF_SSH
          Host pyboat-deploy
            HostName $DEPLOY_HOST
            HostKeyAlias raspberrypi
            User $DEPLOY_USER
            Port $DEPLOY_PORT
            IdentityFile ~/.ssh/pyboat
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
            ConnectTimeout 15
          EOF_SSH
      - name: Deploy and discard current match
        shell: bash
        run: |
          scp deploy/compose.yaml deploy/pyboat-compose.service pyboat-deploy:.local/share/pyboat/
          # shellcheck disable=SC2029
          ssh pyboat-deploy "bash -se -- '$DEPLOY_IMAGE'" <<'EOF_DEPLOY'
          cd ~/.local/share/pyboat
          printf 'GAME_IMAGE=%s\n' "$1" > .env
          podman-compose pull
          install -Dm644 pyboat-compose.service ~/.config/systemd/user/pyboat-compose.service
          systemctl --user daemon-reload
          systemctl --user enable pyboat-compose.service
          systemctl --user restart pyboat-compose.service
          podman image prune --force
          EOF_DEPLOY
