[workspace]
members = ["crates/browser", "crates/game", "crates/protocol", "crates/server", "crates/simulation", "tools/playground-capture"]
resolver = "3"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = "deny"
dbg_macro = "deny"
fn_to_numeric_cast_any = "deny"
let_underscore_must_use = "deny"
lossy_float_literal = "deny"
multiple_unsafe_ops_per_block = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
