[package]
name = "pyboat-playground-capture"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
publish = false

[dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
png = "0.18"
pollster = "0.4"
pyboat-game = { path = "../../crates/game" }
rapier2d = "0.35.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = { version = "30.0.0", default-features = false, features = ["std", "vulkan", "wgsl"] }
