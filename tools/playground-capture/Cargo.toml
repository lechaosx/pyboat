[package]
name = "playground-capture"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
png = "0.18"
pollster = "1.0.1"
game = { path = "../../crates/game" }
rapier2d = "0.35.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = { version = "30.0.0", default-features = false, features = ["std", "vulkan", "wgsl"] }
