[project]
name = "sailing"
version = "0.1.0"
description = "Minimal 2D top-down sailing prototype"
requires-python = ">=3.10"

dependencies = [
    "pygame>=2.5.0",
    "pymunk>=6.6.0",
    "websockets>=16.0,<17.0",
]

[project.scripts]
game = "game.main:main"
server = "game.server:main"
client = "game.client:main"
polar = "plotting.polar:main"
coefficients = "plotting.coefficients:main"

[dependency-groups]
dev = [
    "matplotlib>=3.10.8",
    "pytest>=8.0.0",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["game", "sailing", "plotting"]
