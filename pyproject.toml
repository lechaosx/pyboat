[project]
name = "simple-sailing-game"
version = "0.1.0"
description = "Minimal 2D top-down sailing prototype"
requires-python = ">=3.10"

dependencies = [
    "pygame>=2.5.0",
    "pymunk>=6.6.0",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.10.8"]

[project.scripts]
sailing-game = "simple_sailing_game.game:main"
sailing-plot = "simple_sailing_game.plot:main"
sailing-polar = "simple_sailing_game.polar:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"
